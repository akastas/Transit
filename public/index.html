<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma Transit Dashboard</title>
  
  <!-- Modern Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background decorative elements for premium glassmorphism effect -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- Dashboard Container -->
  <div class="dashboard-container">
    
    <!-- Header: Clock, Title, and Auto-Refresh Indicator -->
    <header class="dashboard-header">
      <div class="header-left">
        <h1>Roma Transit</h1>
        <p class="subtitle">Tabellone Arrivi in Tempo Reale</p>
      </div>
      
      <div class="header-center">
        <!-- Digital Clock (Rome Local Time) -->
        <div id="live-clock" class="live-clock">--:--:--</div>
        <div id="live-date" class="live-date">Caricamento data...</div>
      </div>
      
      <div class="header-right">
        <!-- Status & Update countdown indicator -->
        <div class="status-panel">
          <div class="update-info">
            <span class="label">Aggiornato alle:</span>
            <span id="last-updated" class="value">--:--:--</span>
          </div>
          <div class="countdown-container">
            <div class="countdown-bar-bg">
              <div id="countdown-bar" class="countdown-bar"></div>
            </div>
            <span id="countdown-text" class="countdown-text">Prossimo aggiornamento in 45s</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Grid for 4 Stops -->
    <main id="dashboard-grid" class="dashboard-grid">
      <!-- Stop Card 1 (Placeholder, will be populated by JS) -->
      <div class="stop-card skeleton" id="card-0">
        <div class="stop-header">
          <div class="stop-info">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line sub"></div>
          </div>
        </div>
        <div class="departures-list">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>

      <!-- Stop Card 2 -->
      <div class="stop-card skeleton" id="card-1">
        <div class="stop-header">
          <div class="stop-info">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line sub"></div>
          </div>
        </div>
        <div class="departures-list">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>

      <!-- Stop Card 3 -->
      <div class="stop-card skeleton" id="card-2">
        <div class="stop-header">
          <div class="stop-info">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line sub"></div>
          </div>
        </div>
        <div class="departures-list">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>

      <!-- Stop Card 4 -->
      <div class="stop-card skeleton" id="card-3">
        <div class="stop-header">
          <div class="stop-info">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line sub"></div>
          </div>
        </div>
        <div class="departures-list">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>
    </main>
    
    <!-- Footer / Troubleshooting Info -->
    <footer class="dashboard-footer">
      <div class="footer-left">
        <span class="dot-active"></span> Dashboard attiva su porta local/VPS
      </div>
      <div class="footer-right">
        Basato su dati forniti da <strong>Navitia.io</strong>
      </div>
    </footer>

  </div>

  <!-- Javascript Logic -->
  <script src="app.js"></script>
</body>
</html>
